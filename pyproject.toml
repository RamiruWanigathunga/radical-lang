[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radical-lang"
version = "0.1.0"
description = "A productivity-first, performance-oriented strict superset of Python 3.10+."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "The Radical Language Authors" }
]
keywords = [
    "compiler",
    "language",
    "python-superset",
    "transpiler",
    "performance",
    "simd",
    "metal",
    "gpu",
    "pipelines",
    "dataclasses",
    "mojo"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Code Generators",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
native = [
    "numba>=0.58.0",
]
metal = [
    "pyobjc-framework-Metal>=9.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/radical-lang/radical-lang"
Documentation = "https://github.com/radical-lang/radical-lang#readme"
Repository = "https://github.com/radical-lang/radical-lang.git"
Issues = "https://github.com/radical-lang/radical-lang/issues"

[project.scripts]
radical = "radical.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["radical*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
